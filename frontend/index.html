<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CI/CD EKS Demo</title>
  <style>
    body { font-family: Arial, sans-serif; background:#f4f6f8; display:flex; justify-content:center; padding-top:80px; }
    .card { background:#fff; padding:32px 40px; border-radius:10px; box-shadow:0 2px 10px rgba(0,0,0,.15); text-align:center; }
    .ok { color:#1a8a3a; } .bad { color:#c0392b; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Jenkins CI/CD on EKS</h1>
    <h2 id="msg">Loading...</h2>
    <p>Database: <b id="db">...</b></p>
    <p>Deployed version: <b id="ver">...</b></p>
  </div>
  <script>
    fetch('/api/message').then(r => r.json()).then(d => {
      document.getElementById('msg').textContent = d.message;
      document.getElementById('ver').textContent = d.version;
    }).catch(() => { document.getElementById('msg').textContent = 'Backend not reachable'; });
    fetch('/api/health').then(r => r.json()).then(d => {
      const el = document.getElementById('db');
      el.textContent = d.db; el.className = d.db === 'up' ? 'ok' : 'bad';
    }).catch(() => {});
  </script>
</body>
</html>
